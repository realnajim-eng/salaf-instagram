name: Daily Salaf Post

on:
  schedule:
    - cron: "17 15 * * *"   # chaque jour à 15h17 UTC = 17h17 Paris (été/CEST ; 16h17 Paris en hiver/CET) ; décalé hors pile-heure pour éviter les retards de charge GitHub Actions
  workflow_dispatch:        # déclenchement manuel depuis GitHub

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet requis : un clone shallow fait croire à git que le commit du jour a "ajouté" tous les fichiers, faussant le garde-fou anti-doublon ci-dessous

      - name: Vérifier qu'aucun post n'a déjà été publié aujourd'hui
        id: guard
        run: |
          LAST_DATE=$(git log -1 --format=%cd --date=format:%Y-%m-%d -- tracker.json)
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$LAST_DATE" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️  Un post a déjà été publié aujourd'hui ($LAST_DATE) — run ignoré pour éviter un doublon."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate caption (Claude API)
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_caption.py

      - name: Generate image & post to Instagram
        if: steps.guard.outputs.skip != 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}   # optionnel : PAT pour persister le token Instagram renouvelé
        run: python post_salaf.py

      - name: Commit tracker update
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add tracker.json
          git diff --staged --quiet || git commit -m "Update tracker"
          git push
